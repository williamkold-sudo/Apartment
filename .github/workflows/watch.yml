name: Kereby watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: kereby-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python kereby_watch.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save seen listings
        run: |
          git config user.name "kereby-bot"
          git config user.email "kereby-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Update seen listings" && git push)
